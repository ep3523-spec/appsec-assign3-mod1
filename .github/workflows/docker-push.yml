name: Build and Push Django Image

on:
  push:
    branches: [ main ]
    tags:
      - assign3mod1handin

jobs:
  build-push:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Django Image
        id: buildpush
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/assign3-django:latest,${{ secrets.DOCKERHUB_USERNAME }}/assign3-django:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Image digest
        run: |
          echo "Image digest: ${{ steps.buildpush.outputs.digest }}"
      - name: Post-build security note
        run: |
          echo "Ensure DJANGO_SECRET_KEY is provided at runtime via Kubernetes Secret or CI environment."