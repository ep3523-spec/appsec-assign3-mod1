name: Push Django Image to DockerHub

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main ]
    tags:
      - 'assign3mod1handin'
  workflow_dispatch:

concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight secret check
        shell: bash
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "Required DockerHub secrets missing"; exit 1; fi
          echo "DockerHub secrets present (masked)."
          echo "Username length: ${#REGISTRY_USER}"; echo "Token length: ${#REGISTRY_TOKEN}" | sed 's/.*/(masked)/'
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_TOKEN }}
      
      - name: Build and push assignment3 image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/assign3:v0
            ${{ env.REGISTRY_USER }}/assign3:latest
            ${{ env.REGISTRY_USER }}/assign3:${{ github.sha }}
            ${{ env.REGISTRY_USER }}/assign3:assign3mod1handin
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image digest
        run: |
          echo "Digest: ${{ steps.build.outputs.digest }}"

      - name: Failure summary
        if: failure()
        run: |
          echo "Docker push workflow failed; verify credentials and build configuration."

  trivy-scan:
    name: Trivy Post-Push Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      TRIVY_IGNOREFILE: .trivyignore
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest image
        run: docker pull ${{ env.REGISTRY_USER }}/assign3:latest

      - name: Install Trivy
        run: |
          sudo wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy (SARIF, fail on High/Critical)
        id: trivy_sarif
        run: |
          trivy image \
            --format sarif \
            --output trivy-image.sarif \
            --severity CRITICAL,HIGH \
            --ignorefile .trivyignore \
            ${{ env.REGISTRY_USER }}/assign3:latest || true

      - name: Run Trivy (table summary)
        if: always()
        run: |
          trivy image \
            --format table \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignorefile .trivyignore \
            ${{ env.REGISTRY_USER }}/assign3:latest || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

      - name: Fail on High/Critical vulnerabilities
        if: steps.trivy_sarif.outcome == 'failure'
        run: |
          echo "High/Critical vulnerabilities detected by Trivy"; exit 1

      - name: Scan failure summary
        if: failure()
        run: |
          echo "Trivy scan reported issues. Review SARIF in Security tab."